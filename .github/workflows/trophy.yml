name: Generate GitHub Trophy

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  trophy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Trophy SVG
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: dev-tejasnb
          file: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: tokyonight

      - name: Verify Trophy SVG
        run: |
          echo "Checking generated files..."
          ls -lah profile/

          if [ ! -f profile/trophy.svg ]; then
            echo "ERROR: trophy.svg was not generated!"
            exit 1
          fi

          echo "SUCCESS: trophy.svg exists!"
          file profile/trophy.svg

      - name: Commit Trophy SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f profile/trophy.svg

          echo "Git status:"
          git status

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update GitHub Trophy"
            git push origin main
          fi
